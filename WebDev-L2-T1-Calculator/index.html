<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="calculator-wrapper">
      <section class="calculator">
        <div class="calculator-header">
          <p>CALCULATOR</p>
          <h1>Calculate Anything</h1>
        </div>

        <div class="display">
          <div id="previousDisplay"></div>
          <div id="currentDisplay">0</div>
        </div>

        <div class="buttons">
          <button class="action-btn" data-action="clear">C</button>
          <button class="action-btn" data-action="delete">⌫</button>
          <button class="operator" data-operator="÷">÷</button>
          <button class="operator" data-operator="×">×</button>

          <button class="number" data-number="7">7</button>
          <button class="number" data-number="8">8</button>
          <button class="number" data-number="9">9</button>
          <button class="operator" data-operator="−">−</button>

          <button class="number" data-number="4">4</button>
          <button class="number" data-number="5">5</button>
          <button class="number" data-number="6">6</button>
          <button class="operator" data-operator="+">+</button>

          <button class="number" data-number="1">1</button>
          <button class="number" data-number="2">2</button>
          <button class="number" data-number="3">3</button>
          <button class="equals" data-action="equals">=</button>

          <button class="number zero" data-number="0">0</button>
          <button class="number" data-number=".">.</button>
        </div>

        <p id="errorMessage" class="error-message"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
