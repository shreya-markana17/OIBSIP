<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="converter-wrapper">
      <section class="converter-card">
        <div class="heading">
          <span class="temperature-icon">°</span>

          <h1>Temperature Converter</h1>

          <p>Convert temperatures between Celsius, Fahrenheit and Kelvin.</p>
        </div>

        <div class="converter-form">
          <div class="input-group">
            <label for="temperature">Temperature</label>

            <input
              type="number"
              id="temperature"
              placeholder="Enter temperature"
              step="any"
            />
          </div>

          <div class="input-group">
            <label for="unit">Input Unit</label>

            <select id="unit">
              <option value="celsius">Celsius (°C)</option>
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>

          <button id="convertBtn" type="button">Convert Temperature</button>

          <p id="errorMessage" class="error-message"></p>
        </div>

        <div class="results" id="results">
          <div class="result-box">
            <span class="result-label">Celsius</span>
            <strong id="celsiusResult">-- °C</strong>
          </div>

          <div class="result-box">
            <span class="result-label">Fahrenheit</span>
            <strong id="fahrenheitResult">-- °F</strong>
          </div>

          <div class="result-box">
            <span class="result-label">Kelvin</span>
            <strong id="kelvinResult">-- K</strong>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
