<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Authora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-visual">
        <div class="visual-content">
          <span class="visual-label"> SECURE · SIMPLE · PRIVATE </span>

          <h1>
            Your space.
            <em>Your access.</em>
          </h1>

          <p>
            Sign in to continue to your personal dashboard and keep everything
            in one place.
          </p>
        </div>

        <div class="visual-footer">
          <span>AUTHORA</span>
          <span>EST. 2026</span>
        </div>
      </section>

      <section class="auth-form-section">
        <div class="auth-form-container">
          <div class="mobile-brand">
            <span class="brand-mark">A</span>
            <span>AUTHORA</span>
          </div>

          <div class="form-heading">
            <p class="form-eyebrow">WELCOME BACK</p>

            <h2>Sign in</h2>

            <p>Enter your credentials to access your account.</p>
          </div>

          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="loginIdentifier"> Username or Email </label>

              <input
                type="text"
                id="loginIdentifier"
                placeholder="Enter username or email"
                autocomplete="username"
              />

              <small class="field-error" id="loginIdentifierError"></small>
            </div>

            <div class="form-group">
              <label for="loginPassword"> Password </label>

              <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
              />

              <small class="field-error" id="loginPasswordError"></small>
            </div>

            <p class="form-message" id="loginMessage"></p>

            <button type="submit" class="auth-button">
              Login
              <span>→</span>
            </button>
          </form>

          <div class="form-footer">
            <p>
              Don't have an account?
              <a href="register.html"> Create one </a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
